name: build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      package:
        description: "Only this package (blank = all)"
        required: false
      force:
        description: "Rebuild even if the release already exists"
        type: boolean
        default: false
  push:
    paths:
      - packages/**
      - flake.nix
      - flake.lock
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"
      - id: list
        run: |
          set -euo pipefail
          only='${{ inputs.package }}'
          if [ -n "$only" ]; then
            packages=$(jq -nc --arg p "$only" '[$p]')
          else
            packages=$(nix eval --json '.#packages.x86_64-linux' --apply 'builtins.attrNames')
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - id: meta
        run: |
          set -euo pipefail
          version=$(nix eval --raw ".#${{ matrix.package }}.version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.package }}-v$version" >> "$GITHUB_OUTPUT"

      # A daily cron is a no-op once the release exists.
      - id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.meta.outputs.tag }} already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip == 'false'
        run: nix build --print-build-logs ".#${{ matrix.package }}"

      # The build outputs themselves are the release assets.
      - if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          mkdir -p dist
          find -L result -type f -exec cp -t dist {} +
          chmod -R u+w dist
          ( cd dist && sha256sum * > SHA256SUMS )
          ls -l dist

      - if: steps.check.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ matrix.package }} ${{ steps.meta.outputs.version }}" \
            --notes "nix build .#${{ matrix.package }} from ${{ github.sha }}" \
            dist/*
