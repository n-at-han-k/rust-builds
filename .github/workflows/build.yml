name: build

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      project:
        description: "Only this project (blank = all)"
        required: false
      force:
        description: "Rebuild even if the release already exists"
        type: boolean
        default: false
  push:
    paths:
      - projects/**
      - .github/workflows/build.yml

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          only='${{ inputs.project }}'
          names=$(ls projects)
          if [ -n "$only" ]; then names="$only"; fi
          echo "projects=$(printf '%s\n' $names | jq -Rsc 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # Resolve what to build. `ref` is a commit, a tag, a branch, or the
      # literal "latest-tag" to track upstream's newest tag.
      - id: resolve
        run: |
          set -euo pipefail
          cfg="projects/${{ matrix.project }}/config.json"
          repo=$(jq -r .repo "$cfg")
          ref=$(jq -r .ref "$cfg")

          if [ "$ref" = "latest-tag" ]; then
            ref=$(gh api "repos/$repo/tags" --jq '.[0].name')
          fi
          sha=$(gh api "repos/$repo/commits/$ref" --jq .sha)

          version=$(jq -r '.version // ""' "$cfg")
          if [ -z "$version" ]; then
            case "$ref" in
              [0-9a-f]*) [ ${#ref} -eq 40 ] && version="${sha:0:12}" || version="${ref#v}" ;;
              *) version="${ref#v}" ;;
            esac
          fi

          {
            echo "repo=$repo"
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=${{ matrix.project }}-v$version"
            echo "apt=$(jq -r '(.apt // []) | join(" ")' "$cfg")"
            echo "toolchain=$(jq -r '.toolchain // "stable"' "$cfg")"
          } >> "$GITHUB_OUTPUT"

      # A daily cron is a no-op once the release exists.
      - id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ steps.resolve.outputs.tag }}" >/dev/null 2>&1; then
            echo "${{ steps.resolve.outputs.tag }} already released"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.resolve.outputs.repo }}
          ref: ${{ steps.resolve.outputs.sha }}
          path: src

      - if: steps.check.outputs.skip == 'false' && steps.resolve.outputs.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ${{ steps.resolve.outputs.apt }}

      - if: steps.check.outputs.skip == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.resolve.outputs.toolchain }}

      - if: steps.check.outputs.skip == 'false'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      # build.sh puts whatever should be released into $OUT.
      - if: steps.check.outputs.skip == 'false'
        env:
          SRC: ${{ github.workspace }}/src
          OUT: ${{ github.workspace }}/out
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          cd "$SRC"
          bash "$GITHUB_WORKSPACE/projects/${{ matrix.project }}/build.sh"
          test -n "$(ls -A "$OUT")" || { echo "build.sh produced no artifacts"; exit 1; }

      - if: steps.check.outputs.skip == 'false'
        id: package
        run: |
          set -euo pipefail
          name="${{ matrix.project }}-${{ steps.resolve.outputs.version }}-x86_64-linux"
          tar -czf "$name.tar.gz" -C out .
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.skip == 'false'
        run: |
          gh release create "${{ steps.resolve.outputs.tag }}" \
            --title "${{ matrix.project }} ${{ steps.resolve.outputs.version }}" \
            --notes "${{ steps.resolve.outputs.repo }} at ${{ steps.resolve.outputs.sha }}" \
            "${{ steps.package.outputs.name }}.tar.gz" \
            "${{ steps.package.outputs.name }}.tar.gz.sha256"
